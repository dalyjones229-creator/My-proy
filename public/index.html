<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jabones del Bosque · Cosmética Natural &amp; Artesanal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f6f1e7",
                100: "#eef3ea",
                200: "#d9e8d4",
                600: "#4b7b53",
                700: "#355a3c",
                800: "#2c4631",
              },
            },
            fontFamily: {
              sans: ['"Segoe UI"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-stone-50 text-stone-800 font-sans min-h-screen">
    <header
      class="sticky top-0 z-20 bg-gradient-to-r from-brand-800 via-brand-600 to-emerald-700 text-white flex justify-between items-center px-6 py-4 shadow-lg"
    >
      <div class="flex items-center gap-3">
        <span
          class="text-3xl drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)]"
          aria-hidden="true"
          >🌿</span
        >
        <div>
          <h1
            class="text-xl font-extrabold leading-tight tracking-tight bg-gradient-to-r from-amber-200 via-yellow-100 to-emerald-200 bg-clip-text text-transparent"
          >
            Jabones del Bosque
          </h1>
          <p
            class="text-[11px] uppercase tracking-[0.22em] text-amber-100/90"
          >
            Cosmética natural &amp; artesanal
          </p>
        </div>
      </div>
      <button
        id="cartBtn"
        class="bg-white text-brand-700 rounded-full px-4 py-2 font-semibold flex items-center gap-2 hover:bg-brand-100 transition"
        aria-label="Abrir carrito"
      >
        <span>🛒</span>
        <span id="cartCount">0</span>
        <span
          id="cartTotal"
          class="bg-brand-600 text-white rounded-full px-2 py-0.5 text-xs"
          >$0</span
        >
      </button>
    </header>

    <section
      class="bg-white border-b border-stone-200 px-6 py-4 flex flex-wrap items-center gap-4"
    >
      <input
        id="search"
        type="search"
        placeholder="Buscar jabones..."
        class="flex-1 min-w-[220px] border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-600"
      />
      <select
        id="skin"
        class="border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-600"
      >
        <option value="">Todo tipo de piel</option>
        <option value="dry">Seca</option>
        <option value="oily">Grasa</option>
        <option value="combination">Mixta</option>
        <option value="sensitive">Sensible</option>
        <option value="normal">Normal</option>
        <option value="all">Todas</option>
      </select>
      <label class="text-sm text-stone-600 flex items-center gap-2">
        <input id="handmade" type="checkbox" class="accent-brand-600" /> Hecho a mano
      </label>
      <label class="text-sm text-stone-600 flex items-center gap-2">
        <input id="organic" type="checkbox" class="accent-brand-600" /> Organico
      </label>
      <label class="text-sm text-stone-600 flex items-center gap-2">
        <input id="available" type="checkbox" checked class="accent-brand-600" /> En stock
      </label>
    </section>

    <main
      id="catalog"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-6"
    ></main>

    <aside
      id="cartPanel"
      class="fixed top-0 right-0 w-[360px] max-w-[90vw] h-full bg-white shadow-2xl z-30 flex flex-col transition-transform duration-300 translate-x-full"
    >
      <div class="flex justify-between items-center p-4 border-b border-stone-200">
        <h2 class="text-lg font-semibold">Tu carrito</h2>
        <button id="closeCart" class="text-stone-500 hover:text-stone-800 text-xl leading-none">✕</button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3"></div>
      <div class="p-4 border-t border-stone-200">
        <div class="flex justify-between items-center text-base mb-3">
          <span>Total</span>
          <strong id="cartTotalBig">$0</strong>
        </div>
        <button
          id="checkoutBtn"
          class="w-full bg-brand-800 text-white py-3 rounded-lg font-bold hover:bg-brand-700 transition"
        >
          Pagar
        </button>
        <p id="checkoutMsg" class="text-sm text-center mt-3"></p>
      </div>
    </aside>
    <div id="overlay" class="fixed inset-0 bg-black/30 z-20 hidden"></div>

    <script src="/app.js"></script>
  </body>
</html>
